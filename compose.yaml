services:
  api:
    image: ghcr.io/coolajz/ids-jmk-api:${IMAGE_TAG:-0.1.1}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      GTFS_INTERVAL_SECONDS: ${GTFS_INTERVAL_SECONDS:-3600}
      REALTIME_INTERVAL_SECONDS: ${REALTIME_INTERVAL_SECONDS:-30}
      REALTIME_MAX_AGE_SECONDS: ${REALTIME_MAX_AGE_SECONDS:-180}
    volumes:
      - ids-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  ids-data:
