name: Kontroly
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check api custom_components tests scripts
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --test tests/*.test.mjs
      - run: npm ci && npm run build
        working-directory: web
      - run: docker compose -f compose.web.yaml -f compose.build.yaml config --quiet
      - run: docker compose -f compose.proxy.yaml -f compose.build.yaml config --quiet
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv venv /tmp/ha-tests
      - run: uv pip install --python /tmp/ha-tests/bin/python homeassistant==2025.12.5 pytest
      - run: /tmp/ha-tests/bin/python -m pytest tests/test_ha_config_flow.py -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.web.yaml -f compose.build.yaml build
      - run: docker compose -f compose.web.yaml -f compose.build.yaml up -d
      - name: Ověření prvního importu a webové proxy
        run: python scripts/smoke.py --state /tmp/ids-jmk-smoke.json
      - name: Ověření restartu a persistentních dat
        run: |
          docker compose -f compose.web.yaml restart api
          python scripts/smoke.py --state /tmp/ids-jmk-smoke.json --verify-state
      - if: failure()
        run: docker compose -f compose.web.yaml logs --tail 100
      - if: always()
        run: docker compose -f compose.web.yaml down
  dev-images:
    name: Vývojový obraz (${{ matrix.component }})
    needs: [test, home-assistant, hassfest, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata vývojového obrazu
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/coolajz/ids-jmk-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=long
      - name: Sestavení a publikování vývojového obrazu
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'web' && './web' || '.' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.component }}
