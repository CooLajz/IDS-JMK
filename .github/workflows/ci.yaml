name: Kontroly
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check api custom_components tests scripts home-assistant
      - run: uv run pytest -q
      - name: Řazení vývojových verzí v Home Assistantu
        run: uv run --with awesomeversion==25.8.0 python -m pytest tests/test_ha_channels.py -k supervisor_dev_version_order -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --test tests/*.test.mjs
      - run: npm ci && npm run build
        working-directory: web
      - run: docker compose -f compose.web.yaml -f compose.build.yaml config --quiet
      - run: docker compose -f compose.proxy.yaml -f compose.build.yaml config --quiet
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv venv /tmp/ha-tests
      - run: uv pip install --python /tmp/ha-tests/bin/python homeassistant==2025.12.5 pytest
      - run: /tmp/ha-tests/bin/python -m pytest tests/test_ha_config_flow.py -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.web.yaml -f compose.build.yaml build
      - run: docker compose -f compose.web.yaml -f compose.build.yaml up -d
      - name: Ověření prvního importu a webové proxy
        run: python scripts/smoke.py --state /tmp/ids-jmk-smoke.json
      - name: Ověření restartu a persistentních dat
        run: |
          docker compose -f compose.web.yaml restart api
          python scripts/smoke.py --state /tmp/ids-jmk-smoke.json --verify-state
      - if: failure()
        run: docker compose -f compose.web.yaml logs --tail 100
      - if: always()
        run: docker compose -f compose.web.yaml down
  ha-app:
    name: Aplikace HA (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: home-assistant
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ids-jmk-ha:test
      - name: První start s datovým adresářem Supervisoru
        run: |
          mkdir -p /tmp/ids-ha-data
          python - <<'PYTEST'
          import json, pathlib
          config = json.loads(pathlib.Path('home-assistant/ids_jmk/manifest.json').read_text())
          pathlib.Path('/tmp/ids-ha-data/options.json').write_text(json.dumps(config['options']))
          PYTEST
          chmod 600 /tmp/ids-ha-data/options.json
          docker run -d --name ids-ha --init --platform linux/${{ matrix.arch }} \
            -p 127.0.0.1:18080:8080 -v /tmp/ids-ha-data:/data ids-jmk-ha:test
          python scripts/smoke.py --api-only --url http://127.0.0.1:18080 --timeout 600 --state /tmp/ha-state.json
          test "$(stat -c %u /tmp/ids-ha-data/parser/instance-id)" = 10001
      - name: Restart a zachování identity
        run: |
          docker restart ids-ha
          python scripts/smoke.py --api-only --url http://127.0.0.1:18080 --timeout 600 --state /tmp/ha-state.json --verify-state
      - name: Velikost obrazu
        run: docker image inspect ids-jmk-ha:test --format '{{.Size}}'
      - if: failure()
        run: docker logs --tail 100 ids-ha
      - if: always()
        run: docker rm -f ids-ha
  dev-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: version
        name: Jedinečná verze vývojového parseru
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ha_version=$(python scripts/ha_channels.py dev-version --run-number "$RUN_NUMBER" --attempt "$RUN_ATTEMPT")
          echo "version=$ha_version" >> "$GITHUB_OUTPUT"
  dev-images:
    name: Vývojový obraz (${{ matrix.component }})
    needs: [test, home-assistant, hassfest, docker, ha-app, dev-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, ha]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata vývojového obrazu
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/coolajz/ids-jmk-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=long
            type=raw,value=${{ needs.dev-version.outputs.version }},enable=${{ matrix.component == 'ha' }}
      - name: Sestavení a publikování vývojového obrazu
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'web' && './web' || '.' }}
          target: ${{ matrix.component == 'ha' && 'home-assistant' || '' }}
          build-args: BUILD_VERSION=${{ matrix.component == 'ha' && needs.dev-version.outputs.version || 'dev' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.component }}
  ha-dev-channel:
    name: Nabídka vývojové aplikace HA
    needs: [dev-images, dev-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    uses: ./.github/workflows/ha-channel.yaml
    with:
      channel: dev
      version: ${{ needs.dev-version.outputs.version }}
      source: ${{ github.sha }}
