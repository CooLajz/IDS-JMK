name: Vydání
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/ci.yaml
  check:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen && uv run pytest -q && uv run ruff check api custom_components tests scripts
      - name: Ověření verze
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import json, os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Použij tag vX.Y.Z'
          version = tag[1:]
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == version
          assert json.load(open('web/package.json'))['version'] == version
          lock = json.load(open('web/package-lock.json'))
          assert lock['version'] == lock['packages']['']['version'] == version
          from api.main import app
          assert app.version == version
          assert json.load(open('custom_components/ids_jmk/manifest.json'))['version'] == version
          PY
  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/coolajz/ids-jmk-${{ matrix.component }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component == 'web' && './web' || '.' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Příprava souborů
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp LICENSE docs/data-sources.md release/
          cp .env.example release/env.example
          python - <<'PY'
          import os, pathlib, re, zipfile
          version=os.environ['RELEASE_TAG'][1:]
          for name in ('compose.yaml','compose.web.yaml','compose.proxy.yaml'):
              text=pathlib.Path(name).read_text()
              text=re.sub(r'\$\{IMAGE_TAG:-[^}]+\}',version,text)
              pathlib.Path('release',name).write_text(text)
          with zipfile.ZipFile('release/ids_jmk.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in pathlib.Path('custom_components/ids_jmk').rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts:
                      z.write(p,p.relative_to('custom_components'))
          PY
      - name: Vytvoření draftu releasu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes
