services:
  api:
    image: ghcr.io/coolajz/ids-jmk-api:${IMAGE_TAG:-1.4.0}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      GTFS_INTERVAL_SECONDS: ${GTFS_INTERVAL_SECONDS:-86400}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
      REALTIME_INTERVAL_SECONDS: ${REALTIME_INTERVAL_SECONDS:-60}
      REALTIME_MAX_AGE_SECONDS: ${REALTIME_MAX_AGE_SECONDS:-180}
    volumes:
      - ids-data:/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: ghcr.io/coolajz/ids-jmk-web:${IMAGE_TAG:-1.4.0}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8090}:8080"
    environment:
      API_UPSTREAM: http://api:8080
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  ids-data:
